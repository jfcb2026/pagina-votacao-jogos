<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação do Dia de Jogo — Página De Jogos De Amigos</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main>
  <h1>Votação do Dia de Jogo</h1>
  <p class="subtitle">Marca todos os dias (de segunda a sexta) em que consegues jogar. Podes marcar vários dias, até todos. <strong>Fica guardado automaticamente</strong> assim que marcas ou desmarcas.</p>
  <p class="subtitle" id="horario-label" style="margin-top:-6px"></p>

  <div class="card card-fit">
    <div class="table-scroll">
      <table id="votacao-dia-table">
        <thead><tr id="votacao-dia-head"></tr></thead>
        <tbody id="votacao-dia-body"></tbody>
        <tfoot><tr id="votacao-dia-total"></tr></tfoot>
      </table>
    </div>
  </div>

  <div class="card card-sync" id="resultado-dia-card" style="display:none">
    <h2 style="margin-top:0">Dia com Mais Votos</h2>
    <div id="resultado-dia-box"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js?v=10"></script>
<script src="assets/js/votacao-dia.js?v=6"></script>
</body>
</html>
