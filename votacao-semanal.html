<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação Semanal — Página De Jogos De Amigos</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main>
  <h1>Votação Semanal</h1>
  <p class="subtitle">Cada membro escolhe os jogos que quer votar. Uma célula preenchida conta 1 voto para o jogo escolhido.</p>
  <p class="subtitle" id="dia-jogo-label" style="margin-top:-6px"></p>

  <div class="card card-fit">
    <div class="votacao-wrap">
      <div class="table-scroll">
        <table id="votacao-table">
          <thead><tr id="votacao-head"></tr></thead>
          <tbody id="votacao-body"></tbody>
        </table>
      </div>
      <div class="actions-row" style="margin-top:14px; margin-bottom:0; align-items:center;">
        <button class="primary" id="validar-btn">Validar Votos</button>
        <button class="danger" id="reiniciar-btn" style="display:none">Reiniciar Votos</button>
        <span class="login-error" id="validar-erro" style="min-height:auto;"></span>
      </div>
    </div>
  </div>

  <div class="card card-sync">
    <h2 style="margin-top:0">Resultados</h2>
    <ul class="results-list" id="results-list"></ul>
    <div id="winner-box"></div>
  </div>

  <div class="card card-sync">
    <h2 style="margin-top:0">Histórico de Jogos Vencedores</h2>
    <ul class="results-list" id="historico-list"></ul>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/votacao.js"></script>
</body>
</html>
