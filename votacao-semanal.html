<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação do Jogo Semanal — Página De Jogos De Amigos</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main>
  <h1>Votação do Jogo Semanal</h1>
  <p class="subtitle">Cada membro escolhe os jogos que quer votar diretamente na tabela. <strong>O voto é guardado automaticamente</strong> assim que selecionas um jogo, <strong>não é preciso carregar em mais nada</strong>.</p>
  <p class="subtitle" id="dia-jogo-label" style="margin-top:-6px"></p>
  <p class="voto-feedback" id="voto-feedback" style="min-height:18px; margin:0 0 8px; text-align:center;"></p>

  <div class="card card-fit">
    <div class="votacao-wrap">
      <div class="table-scroll">
        <table id="votacao-table">
          <thead><tr id="votacao-head"></tr></thead>
          <tbody id="votacao-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card card-sync">
    <h2 style="margin-top:0">Resultados</h2>
    <ul class="results-list" id="results-list"></ul>
    <div class="actions-row votacao-resultados-actions" style="margin-top:14px; margin-bottom:0; align-items:center;">
      <button class="primary" id="fechar-votacao-btn">Fechar Votação</button>
      <button class="primary" id="desbloquear-votos-btn" style="display:none">Reabrir Votação</button>
      <button class="primary" id="sortear-vencedor-btn" style="display:none">Sortear Vencedor</button>
      <button class="primary" id="validar-btn" style="display:none">Validar Votos</button>
      <button class="danger" id="reiniciar-votacao-btn" style="display:none">Reiniciar Votação</button>
      <span class="login-error" id="validar-erro" style="min-height:auto;"></span>
    </div>
  </div>

  <div class="card card-sync" id="winner-card" style="display:none">
    <div id="winner-box"></div>
  </div>

  <div class="card card-sync">
    <h2 style="margin-top:0">Histórico de Jogos Vencedores</h2>
    <ul class="results-list" id="historico-list"></ul>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js?v=18"></script>
<script src="assets/js/votacao.js?v=4"></script>
</body>
</html>
