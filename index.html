<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página De Jogos De Amigos — Acesso</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1 id="site-name-heading">🎮 Página De Jogos De Amigos</h1>
    <p class="subtitle">Introduz a password de acesso</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="primary" id="login-btn" style="width:100%">Entrar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
try {
  document.getElementById("site-name-heading").textContent = "🎮 " + loadStore("nomeSite");

  function redirectDestination() {
    const target = sessionStorage.getItem("jogosAmigos_redirect");
    sessionStorage.removeItem("jogosAmigos_redirect");
    return target || "votacao-semanal.html";
  }

  if (isAuthenticated()) {
    window.location.href = redirectDestination();
  }

  const input = document.getElementById("password-input");
  const error = document.getElementById("login-error");

  function tryLogin() {
    if (input.value === getActivePassword()) {
      sessionStorage.setItem("jogosAmigos_auth", "ok");
      window.location.href = redirectDestination();
    } else {
      error.textContent = "Password incorreta.";
    }
  }

  document.getElementById("login-btn").addEventListener("click", tryLogin);
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
} catch (e) {
  /* Se o browser estiver a bloquear o acesso a dados locais (cookies
     desativados, navegação privada muito restritiva, etc.), o site não
     consegue funcionar, mas em vez de ficar sem reação nenhuma, mostra
     esta mensagem para se perceber o que se passa. */
  document.getElementById("login-error").textContent =
    "Não foi possível carregar o site neste browser. Verifica se os cookies/dados do site estão permitidos (não estás em navegação privada com bloqueio total) e tenta novamente.";
  console.error("Erro ao carregar o site:", e);
}
</script>
</body>
</html>
