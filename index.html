<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página De Jogos De Amigos — Acesso</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1 id="site-name-heading">🎮 Página De Jogos De Amigos</h1>
    <p class="subtitle">Introduz a password de acesso</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="primary" id="login-btn" style="width:100%">Entrar</button>
  </div>
</div>

<script>
/* Este pequeno bloco corre logo a seguir ao formulário, ANTES de se
   carregarem as bibliotecas do Firebase (que vêm de um CDN externo e, num
   browser completamente limpo/anónimo sem nada em cache, podem demorar
   alguns segundos a transferir). Sem isto, o botão "Entrar" só ficava
   ativo depois de essas bibliotecas todas terminarem de carregar — a
   página parecia pronta mas um clique nesse intervalo não fazia nada, daí
   parecer "sem reação" só na primeira visita e passar a funcionar com um
   simples refresh (a partir do momento em que o browser já tinha tudo em
   cache). Este bloco não depende de nada externo, por isso fica sempre
   pronto de imediato. */
try {
  function redirectDestination() {
    const target = sessionStorage.getItem("jogosAmigos_redirect");
    sessionStorage.removeItem("jogosAmigos_redirect");
    return target || "votacao-semanal.html";
  }

  if (sessionStorage.getItem("jogosAmigos_auth") === "ok") {
    window.location.href = redirectDestination();
  }

  function getActivePasswordFast() {
    try {
      const raw = localStorage.getItem("jogosAmigos_passwordOverride");
      if (raw !== null) {
        const override = JSON.parse(raw);
        if (override) return override;
      }
    } catch (e) { /* sem acesso a localStorage: segue para a password por defeito */ }
    return "alterar123";
  }

  const input = document.getElementById("password-input");
  const error = document.getElementById("login-error");

  function doLogin() {
    try { sessionStorage.setItem("jogosAmigos_auth", "ok"); } catch (e) { /* ignora */ }
    window.location.href = redirectDestination();
  }

  function tryLogin() {
    if (input.value === getActivePasswordFast()) {
      doLogin();
    } else {
      error.textContent = "Password incorreta.";
    }
  }

  document.getElementById("login-btn").addEventListener("click", tryLogin);
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });

  /* Na primeiríssima visita a este browser (nada em cache, nada
     sincronizado ainda), a password definida no Backoffice pode ainda não
     ter chegado a tempo do utilizador tentar entrar — só fica disponível
     depois de a página terminar de carregar tudo (Firebase, etc.) e a
     sincronização com a nuvem correr em segundo plano. Como isso resolve-se
     sempre com um simples refresh, faz-se aqui um único refresh automático
     e silencioso assim que a página (e tudo o que ela carrega) estiver
     pronta — só uma vez por sessão de browser, para não entrar em ciclo. */
  try {
    if (!sessionStorage.getItem("jogosAmigos_autoReload")) {
      sessionStorage.setItem("jogosAmigos_autoReload", "1");
      window.addEventListener("load", () => {
        window.location.reload();
      });
    }
  } catch (e) { /* sem sessionStorage: sem refresh automático, mas o site continua a funcionar */ }
} catch (e) {
  document.getElementById("login-error").textContent =
    "Não foi possível carregar o site neste browser. Verifica se os cookies/dados do site estão permitidos (não estás em navegação privada com bloqueio total) e tenta novamente.";
  console.error("Erro ao carregar o site:", e);
}
</script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js"></script>
<script>
/* Depois de tudo carregado, só atualiza o título com o nome do site
   (personalizável no Backoffice) — isto é apenas estético e nunca deve
   bloquear o login, por isso corre à parte, depois do bloco de cima. */
try {
  document.getElementById("site-name-heading").textContent = "🎮 " + loadStore("nomeSite");
} catch (e) { /* mantém o título por defeito */ }
</script>
</body>
</html>
