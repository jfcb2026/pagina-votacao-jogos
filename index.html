<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página De Jogos De Amigos — Acesso</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1 id="site-name-heading">🎮 Página De Jogos De Amigos</h1>
    <p class="subtitle">Introduz a password de acesso</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="primary" id="login-btn" style="width:100%">Entrar</button>
  </div>
</div>

<script>
try {
  function redirectDestination() {
    const target = sessionStorage.getItem("jogosAmigos_redirect");
    sessionStorage.removeItem("jogosAmigos_redirect");
    return target || "votacao-semanal.html";
  }

  if (sessionStorage.getItem("jogosAmigos_auth") === "ok") {
    window.location.href = redirectDestination();
  }

  async function sha256Hex(texto) {
    const bytes = new TextEncoder().encode(texto);
    const buffer = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const input = document.getElementById("password-input");
  const error = document.getElementById("login-error");
  const loginBtn = document.getElementById("login-btn");
  const loginBtnLabel = loginBtn.innerHTML;

  function setLoading(ligado) {
    loginBtn.disabled = ligado;
    loginBtn.innerHTML = ligado ? '<span class="spinner"></span>' : loginBtnLabel;
  }

  function doLogin() {
    try { sessionStorage.setItem("jogosAmigos_auth", "ok"); } catch (e) { /* ignora */ }
    window.location.href = redirectDestination();
  }

  function esperarFirebasePronto(timeoutMs) {
    return new Promise(resolve => {
      const inicio = Date.now();
      function verificar() {
        if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) {
          const auth = firebase.auth();
          if (auth.currentUser) { resolve(true); return; }
          let resolvido = false;
          const unsubscribe = auth.onAuthStateChanged(user => {
            if (resolvido || !user) return;
            resolvido = true;
            unsubscribe();
            resolve(true);
          });
          /* Se a autenticação anónima feita em common.js (ao carregar a
             página) tiver falhado por uma instabilidade pontual de rede,
             nunca mais chegaria nenhum evento e ficaria sempre à espera até
             ao timeout, obrigando a um refresh manual para tentar de novo.
             Este pedido extra garante que o próprio clique em "Entrar"
             também tenta autenticar - é seguro repetir, o Firebase devolve
             a mesma sessão se já existir uma, ou tenta uma nova. */
          auth.signInAnonymously().catch(() => { /* falha tratada pelo timeout abaixo */ });
          setTimeout(() => {
            if (resolvido) return;
            resolvido = true;
            unsubscribe();
            resolve(false);
          }, Math.max(timeoutMs - (Date.now() - inicio), 0));
          return;
        }
        if (Date.now() - inicio >= timeoutMs) { resolve(false); return; }
        setTimeout(verificar, 150);
      }
      verificar();
    });
  }

  async function buscarHashGuardado() {
    const pronto = await esperarFirebasePronto(15000);
    if (!pronto) return { ok: false, valor: null };
    try {
      const doc = await firebase.firestore().collection("jogosAmigos").doc("passwordOverride").get();
      const valor = doc.exists && doc.data().value ? doc.data().value : null;
      return { ok: true, valor };
    } catch (e) {
      return { ok: false, valor: null };
    }
  }

  async function tryLogin() {
    error.textContent = "";
    setLoading(true);
    try {
      const defaultPassword = "alterar123";
      const digest = await sha256Hex(input.value);
      const resultado = await buscarHashGuardado();
      const stored = resultado.valor;

      if (!resultado.ok) {
        const esperado = await sha256Hex(defaultPassword);
        if (digest === esperado) { doLogin(); return; }
        error.textContent = "Sem ligação para verificar a password. Tenta novamente.";
        return;
      }

      const esperado = stored !== null ? stored : await sha256Hex(defaultPassword);
      if (digest === esperado) { doLogin(); return; }

      const pareceHash = v => /^[0-9a-f]{64}$/i.test(v);
      if (stored !== null && !pareceHash(stored) && input.value === stored) {
        doLogin();
        return;
      }

      error.textContent = "Password incorreta.";
    } catch (e) {
      error.textContent = "Password incorreta.";
    } finally {
      setLoading(false);
      try { localStorage.removeItem("jogosAmigos_passwordOverride"); } catch (e) { /* ignora */ }
    }
  }

  loginBtn.addEventListener("click", tryLogin);
  input.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
} catch (e) {
  document.getElementById("login-error").textContent =
    "Não foi possível carregar o site neste browser. Verifica se os cookies/dados do site estão permitidos (não estás em navegação privada com bloqueio total) e tenta novamente.";
  console.error("Erro ao carregar o site:", e);
}
</script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js?v=17"></script>
<script>
try {
  document.getElementById("site-name-heading").textContent = "🎮 " + loadStore("nomeSite");
} catch (e) { /* mantém o título por defeito */ }
</script>
</body>
</html>
