<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos ainda não jogados — Página De Jogos De Amigos</title>
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem("jogosAmigos_tema"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main>
  <h1>Jogos ainda não jogados</h1>
  <p class="subtitle">Ideias de jogos por experimentar. Quando o grupo já tiver jogado, migra o jogo para os Jogos Habituais.</p>

  <div class="card">
    <p class="hint" id="import-hint" style="margin-top:0"></p>
    <div class="table-scroll">
      <table id="nao-jogados-table">
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="actions-row" style="margin-top:14px; margin-bottom:0">
      <button class="primary" id="add-jogo-btn">+ Jogo</button>
      <button id="import-btn">Importar de Excel</button>
      <input type="file" id="import-input" accept=".xlsx,.xls,.csv" style="display:none">
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js?v=15"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/jogos-nao-jogados.js"></script>
</body>
</html>
